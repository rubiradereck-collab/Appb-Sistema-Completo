name: Compilar Sistema de Incidencias

# Se ejecuta cada vez que se sube codigo a la rama principal o se abre/actualiza un Pull Request
on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  build:
    # Usamos un servidor de Windows porque el proyecto es .NET Framework 4.7.2
    runs-on: windows-latest 

    steps:
    - name: 📥 Descargar código fuente
      uses: actions/checkout@v3

    - name: 🛠️ Configurar MSBuild
      uses: microsoft/setup-msbuild@v1.1

    - name: 📦 Configurar NuGet
      uses: NuGet/setup-nuget@v1.1

    - name: 🔄 Restaurar paquetes NuGet (TopShelf, Serilog, BCrypt, etc.)
      run: nuget restore APPB.slnx

    - name: ⚙️ Crear app.config a partir de los .example
      # Los app.config reales llevan contraseñas y están en .gitignore;
      # para compilar basta con las plantillas (no se usan para ejecutar).
      shell: pwsh
      run: |
        Get-ChildItem -Recurse -Filter "*.config.example" | ForEach-Object {
          $destino = $_.FullName -replace '\.example$', ''
          if (-not (Test-Path $destino)) { Copy-Item $_.FullName $destino; Write-Host "Creado $destino" }
        }

    - name: 🚀 Compilar en modo Release
      # Compila todo optimizado para producción
      run: msbuild APPB.slnx /p:Configuration=Release 

    - name: 💾 Guardar Artefacto - Bot (Servicio)
      uses: actions/upload-artifact@v4
      with:
        name: Bot-Produccion
        path: Bot\bin\Release\

    - name: 💾 Guardar Artefacto - WinForms (Cliente)
      uses: actions/upload-artifact@v4
      with:
        name: Escritorio-Produccion
        path: Presentacion\bin\Release\

  validar-bd:
    # Carga BD_Completa.sql en un PostgreSQL real para detectar errores de sintaxis
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dbincidencias
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
    - name: 📥 Descargar código fuente
      uses: actions/checkout@v4

    - name: 🐘 Crear la base de datos con BD_Completa.sql
      env:
        PGPASSWORD: postgres
      run: psql -h localhost -U postgres -d dbincidencias -v ON_ERROR_STOP=1 -f BD_Completa.sql

    - name: 🧩 Aplicar BD_Etapa2.sql (dos veces, para comprobar que se puede repetir)
      env:
        PGPASSWORD: postgres
      run: |
        psql -h localhost -U postgres -d dbincidencias -v ON_ERROR_STOP=1 -f BD_Etapa2.sql
        psql -h localhost -U postgres -d dbincidencias -v ON_ERROR_STOP=1 -f BD_Etapa2.sql

    - name: 🧩 Aplicar BD_Etapa3.sql (dos veces)
      env:
        PGPASSWORD: postgres
      run: |
        psql -h localhost -U postgres -d dbincidencias -v ON_ERROR_STOP=1 -f BD_Etapa3.sql
        psql -h localhost -U postgres -d dbincidencias -v ON_ERROR_STOP=1 -f BD_Etapa3.sql

    - name: 🧩 Aplicar BD_Etapa4.sql (dos veces)
      env:
        PGPASSWORD: postgres
      run: |
        psql -h localhost -U postgres -d dbincidencias -v ON_ERROR_STOP=1 -f BD_Etapa4.sql
        psql -h localhost -U postgres -d dbincidencias -v ON_ERROR_STOP=1 -f BD_Etapa4.sql
